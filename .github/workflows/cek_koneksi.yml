name: Cek Koneksi SimKuliah

# Diagnosa: apakah runner GitHub (luar negeri) bisa mengakses SimKuliah?
on:
  workflow_dispatch:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - name: Lokasi runner
        run: curl -s -m 10 ipinfo.io | grep -E '"(ip|country|org)"' || true

      - name: DNS
        run: getent hosts simkuliah.usk.ac.id || echo "DNS gagal"

      - name: Koneksi TCP port 443
        run: timeout 20 bash -c '</dev/tcp/simkuliah.usk.ac.id/443' && echo "TCP OK" || echo "TCP GAGAL / timeout"

      - name: HTTPS ke SimKuliah
        run: |
          curl -s -o /dev/null -m 60 \
            -w "code=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s first_byte=%{time_starttransfer}s total=%{time_total}s\n" \
            https://simkuliah.usk.ac.id/ || echo "curl gagal, exit $?"

      - name: Pembanding (situs lain)
        run: curl -s -o /dev/null -m 20 -w "google code=%{http_code} total=%{time_total}s\n" https://www.google.com/
